<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Rememberer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button.forget { background: #ef4444; }
        button.forget:hover { background: dc2626; }
        .status { margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="title">Checking status...</h1>
        <p id="ip-display">IP: Loading...</p>
        
        <div id="action-area" style="display: none;">
            <button id="remember-btn" onclick="rememberMe()">Remember Me</button>
            <button id="forget-btn" class="forget" onclick="forgetMe()" style="display: none;">Forget Me</button>
        </div>
        
        <div class="status" id="message"></div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('ip-display').innerText = `Your IP: ${data.ip}`;
                
                if (data.remembered) {
                    document.getElementById('title').innerText = "Welcome back!";
                    document.getElementById('message').innerText = "We remembered you from a previous session.";
                    document.getElementById('remember-btn').style.display = 'none';
                    document.getElementById('forget-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('title').innerText = "Hello Stranger!";
                    document.getElementById('message').innerText = "Click below to let us remember your IP.";
                    document.getElementById('remember-btn').style.display = 'inline-block';
                    document.getElementById('forget-btn').style.display = 'none';
                }
                document.getElementById('action-area').style.display = 'block';
            } catch (err) {
                document.getElementById('title').innerText = "Error";
                document.getElementById('message').innerText = "Could not connect to backend.";
            }
        }

        async function rememberMe() {
            const res = await fetch('/api/remember', { method: 'POST' });
            if (res.ok) checkStatus();
        }

        async function forgetMe() {
            const res = await fetch('/api/forget', { method: 'POST' });
            if (res.ok) checkStatus();
        }

        checkStatus();
    </script>
</body>
</html>
